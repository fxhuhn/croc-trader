# File prefixes to remove when extracting symbol names
file_prefixes:
  - "BATS_"
  - "CBOE_DLY_"
  - "NASDAQ_DLY_"
  - "XETR_DLY_"
  - "CBOEFTSE_DLY_"
  - "EURONEXT_DLY_"

# Optional: Add these columns to your CSV if not present
# They are used for swing range calculations
required_columns:
  - "Wolke Linie Grün"
  - "Wolke Linie Pink"

use_swing_range: false

# Multiprocessing settings
# 0 = auto-detect (75% of CPU cores)
# 1 = no multiprocessing (useful for debugging)
# >1 = specific number of workers
num_workers: 0

shift_columns:
  - setter
  - trend
  - welle
  - wolke
  - status
  - kerze
  - bull_gruen
  - bull_grau
  - bull_1

shift_depth: 3