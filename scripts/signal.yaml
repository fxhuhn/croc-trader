# Signal Definitions (comment out to disable)
signals:
  AW Rocket: "bull_orange == 1 and wolke == 'grün' and (trend == 'schwarz' or trend == 'grün')"
  Full House rot&orange+grau/gruen: "bull_rot == 1 and bull_orange == 1 and (bull_grau == 1 or bull_gruen == 1)"
  Full House grau&gruen+rot/orange: "bull_gruen == 1 and bull_grau == 1 and (bull_rot == 1 or bull_orange == 1)"
  3 Kerzen Grau/Grün: "(bull_1 == 1 or bull_1_prev_1 == 1 or bull_1_prev_2) and (bull_grau == 1 or bull_grau_prev_1 == 1 or bull_grau_prev_2)"
  Pearl Diver Light: (status_prev_2 == 'rot' and kerze_prev_2 == 'rot' and wolke_prev_2 == 'grün' and trend_prev_2 == 'rot' and setter_prev_2 == 'rot' and welle_prev_2 == 'rot') and (status_prev_1 == 'rot' and kerze_prev_1 == 'rot' and wolke_prev_1 == 'grün' and trend_prev_1 == 'rot' and setter_prev_1 == 'rot' and welle_prev_1 == 'rot') and (status == 'rot' and kerze != 'rot' and wolke== 'grün' and trend== 'rot' and setter == 'rot' and welle == 'rot')
  Pearl Diver: (status_prev_2 == 'rot' and kerze_prev_2 == 'rot' and wolke_prev_2 == 'rot' and trend_prev_2 == 'rot' and setter_prev_2 == 'rot' and welle_prev_2 == 'rot') and (status_prev_1 == 'rot' and kerze_prev_1 == 'rot' and wolke_prev_1 == 'rot' and trend_prev_1 == 'rot' and setter_prev_1 == 'rot' and welle_prev_1 == 'rot') and (status == 'rot' and kerze != 'rot' and wolke== 'rot' and trend== 'rot' and setter == 'rot' and welle == 'rot')
  Stephan: deluxe == 'dunkelrot' and wolke == 'grün' and trend == 'schwarz' and setter == 'rot'
  Setup des Jahres: bear_plus == 1 and wolke == 'grün'
  Red & Orange & Bull 1: "bull_rot == 1 and bull_orange == 1 and bull_1 == 1"
  Red & Orange: "bull_rot == 1 and bull_orange == 1 and bull_1 != 1"
  Red Lolly: "bull_rot == 1 and bull_1 == 1"
  Orange Lolly: "bull_orange == 1 and bull_1 == 1"
  Red Devil: "bull_rot == 1 and bull_1 != 1"
  Orange: "bull_orange == 1 and bull_1 != 1"
  Red Green Rocket (RGR): "bull_gruen == 1 and kerze == 'rot'"
  Red Green Rocket: "bull_gruen == 1 and kerze == 'rot'"
  Green Green Rocket: "bull_gruen == 1 and kerze == 'grün'"
  Ultimate Blue: "bull_blau == 1 and bull_gruen == 1"
  BearBull: "bull_bb == 1"
  Grabber: "bull_grabber == 1"
  Grau: "bull_grau == 1"
  Grün: "bull_gruen == 1"
  # Add more signals here as needed

# Color Mappings
mappings:
  deluxe:
    Standard: "schwarz"
    Over Bought High: "dunkelgrün"
    Over Bought: "grün"
    Over Sold: "rot"
    Over Sold High: "dunkelrot"

  welle:
    Welle: "grün"
    Welle.1: "dunkelgrün"
    Welle.2: "schwarz"
    Welle.3: "rot"
    Welle.4: "gelb"
    Welle.5: "dunkelrot"

  trend:
    Trend: "schwarz"
    Trend.1: "rot"
    Trend.2: "grün"

  setter:
    Trend.3: "schwarz"
    Trend.4: "rot"
    Trend.5: "grün"

  wolke:
    Wolke: "grün"
    Wolke.2: "rot"

  kerze:
    Kerzenfarbe: "grün"
    Kerzenfarbe.1: "schwarz"
    Kerzenfarbe.2: "rot"

  status:
    Status: "gelb"
    Status.1: "rot"
    Status.2: "grün"

  msi_day:
    Day OverBought: "grün"
    Day OverBought.2: "rot"

  msi_week:
    Week OverBought: "grün"

  msi_month:
    Week OverBought.3: "grün"

