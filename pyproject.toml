# pyproject.toml
# Konfiguration für Ruff Linter & Formatter

[tool.ruff]
# Zielversion von Python
target-version = "py312"

# Maximale Zeilenlänge
line-length = 88

# Ein- und Ausschlusskriterien
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "scripts"
]

[tool.ruff.lint]
# Aktivierte Regelsätze:
# E/W: pycodestyle
# F: Pyflakes
# I: isort (Import-Sortierung)
# N: pep8-naming
# UP: pyupgrade (Upgrade auf moderne Python-Syntax)
# B: flake8-bugbear (Fehlererkennung)
# A: flake8-builtins
# C4: flake8-comprehensions
# PL: Pylint (Code-Qualität und Warnungen)
# C90: mccabe Komplexität
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PL", "C90"]

# Ignorierte Regeln
# E501: Zeilenlänge (durch Formatter oder für lange SQL-Queries/Kommentare toleriert)
ignore = [
    "E501", "A005"
]

[tool.ruff.lint.per-file-ignores]
# Targeted per-file-ignores for legacy test, script, route callback, and existing legacy modules
"test/*" = [
    "C901", "E402", "N802", "N803", "PLC0415", "PLR0911", "PLR0912",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004"
]
".agents/*" = ["C901", "PLR0912", "PLR0915"]
# Targeted legacy ruff ignores, verified 2026-07-30
"app/database/repositories/trade.py" = ["PLR0913", "PLR0917"]
"app/services/backfill_engine.py" = ["PLR0913"]
"app/services/screener/engine.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50

[tool.ruff.lint.isort]
# Festlegen der Sektionen für die Import-Sortierung
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["app"]

[tool.ruff.format]
# Standard-Formatierungseinstellungen
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["app"]
exclude = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "yfinance.*",
    "tvdatafeed.*",
    "tvDatafeed.*",
    "tvDatafeed",
    "scipy.*",
    "plotly.*",
    "pytz.*",
    "apscheduler.*",
]
ignore_missing_imports = true



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "tier1: Fast unit and boundary tests (< 15s)",
    "tier2: Robustness, property-based fuzzing and fault injection (< 2m)",
    "tier3: Chaos engineering and deep golden master replays",
]

[tool.mutmut]
source_paths = [
    "app/services/market/provider.py",
    "app/services/market/quality.py",
    "app/services/market/tv_provider.py",
    "app/services/market/updater.py",
    "app/services/screener/strategies/bounce_bandit.py",
    "app/services/screener/strategies/bridge_scout.py",
    "app/services/screener/strategies/croc_setup.py",
    "app/services/screener/strategies/dip_buyer.py",
    "app/services/screener/strategies/ndx_momentum.py",
    "app/services/screener/strategies/tgim.py",
    "app/services/screener/strategies/turnover_timing.py",
    "app/services/screener/strategies/two_percent_strategy.py",
    "app/services/trade_manager/strategies/bounce_bandit.py",
    "app/services/trade_manager/strategies/bridge_scout.py",
    "app/services/trade_manager/strategies/dip_buyer.py",
    "app/services/trade_manager/strategies/ndx_momentum.py",
    "app/services/trade_manager/strategies/turnover_timing.py",
    "app/services/trade_manager/strategies/tgim.py",
    "app/services/trade_manager/strategies/two_percent_strategy.py",

    "app/tools/indicators.py",
]
backup = false
runner = "pytest"








[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.vulture]
paths = ["app", "scripts", "vulture_whitelist.py"]
exclude = [".venv", "test", "data", "app/templates"]
min_confidence = 80

[tool.bandit]
exclude_dirs = [".venv", "test"]
skips = []

