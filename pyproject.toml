[tool.pytest.ini_options]
testpaths = ["test"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.vulture]
paths = ["app", "scripts", "vulture_whitelist.py"]
exclude = [".venv", "test", "data", "app/templates"]
min_confidence = 80

[tool.bandit]
exclude_dirs = [".venv", "test"]
skips = []
