# pyproject.toml
# Konfiguration für Ruff Linter & Formatter

[tool.ruff]
# Zielversion von Python
target-version = "py312"

# Maximale Zeilenlänge
line-length = 88

# Ein- und Ausschlusskriterien
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
# Aktivierte Regelsätze:
# E/W: pycodestyle
# F: Pyflakes
# I: isort (Import-Sortierung)
# N: pep8-naming
# UP: pyupgrade (Upgrade auf moderne Python-Syntax)
# B: flake8-bugbear (Fehlererkennung)
# A: flake8-builtins
# C4: flake8-comprehensions
# PL: Pylint (Code-Qualität und Warnungen)
# C90: mccabe Komplexität
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PL", "C90"]

# Ignorierte Regeln
# E501: Zeilenlänge (durch Formatter oder für lange SQL-Queries/Kommentare toleriert)
ignore = [
    "E501"
]

[tool.ruff.lint.per-file-ignores]
# Targeted per-file-ignores for legacy test, script, route callback, and existing legacy modules
"test/*" = [
    "C901", "E402", "N802", "N803", "PLC0415", "PLR0911", "PLR0912",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004"
]
"scripts/*" = [
    "C901", "E402", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR0917", "PLR2004"
]
".agents/*" = ["C901", "PLR0912", "PLR0915"]
"app/routes/*" = [
    "C901", "E402", "N802", "N803", "PLC0415", "PLR0911", "PLR0912",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004"
]
"app/services/*" = [
    "C901", "E402", "N802", "N803", "PLC0415", "PLR0911", "PLR0912",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004"
]
"app/database/*" = [
    "C901", "E402", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR0917", "PLR2004"
]
"app/tools/*" = [
    "C901", "E402", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR0917", "PLR2004"
]
"app/config.py" = ["C901", "PLC0415", "PLR0912", "PLR0915", "PLR2004"]
"app/tasks.py" = ["C901", "PLC0415", "PLR0912", "PLR0915", "PLR2004"]
"app/__init__.py" = ["E402", "PLC0415", "PLR2004"]
"vulture_whitelist.py" = ["F401", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50

[tool.ruff.lint.isort]
# Festlegen der Sektionen für die Import-Sortierung
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["app"]

[tool.ruff.format]
# Standard-Formatierungseinstellungen
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["app"]
exclude = ["^\\.venv/", "^build/", "^dist/"]

# Legacy code overrides: Verified pre-existing app modules pre-date strict MyPy typing.
# Newly added or strictly refactored modules must be excluded from this list to enforce strict MyPy checks.
[[tool.mypy.overrides]]
module = [
    "app",
    "app.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.vulture]
paths = ["app", "scripts", "vulture_whitelist.py"]
exclude = [".venv", "test", "data", "app/templates"]
min_confidence = 80

[tool.bandit]
exclude_dirs = [".venv", "test"]
skips = []
