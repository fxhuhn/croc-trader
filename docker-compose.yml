services:
  croc-trader:
    image: ghcr.io/fxhuhn/croc-trader:dev
    container_name: croc-trader

    ports:
      - "8001:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./settings.yaml:/app/settings.yaml

    environment:
      - APP_ENV=production
      - FLASK_SECRET_KEY=change_me_in_production_please
      - TZ=Europe/Berlin

    # HIER ist der direkte Startbefehl ohne entrypoint.sh
    # workers 1: WICHTIG für deinen Background-Worker (Singleton)
    # threads 8: Erlaubt parallele Webhook-Verarbeitung
    command: gunicorn -c gunicorn_conf.py --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:8001 --access-logfile - --error-logfile - run:app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 3