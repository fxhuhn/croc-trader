services:
  croc-trader:
    build: .
    container_name: croc-trader
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./settings.yaml:/app/settings.yaml

    environment:
      - APP_ENV=production
      - FLASK_SECRET_KEY=change_me_in_production_please
      - TZ=Europe/Berlin

    # HIER ist der direkte Startbefehl ohne entrypoint.sh
    # workers 1: WICHTIG für deinen Background-Worker (Singleton)
    # threads 8: Erlaubt parallele Webhook-Verarbeitung
    command: gunicorn --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:5000 --access-logfile - --error-logfile - run:app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s