<script>
    function toggleCard(cardElement) {
        if (!cardElement) return;

        const detailsElement = cardElement.querySelector('.hidden-details');
        const chevronIcon = cardElement.querySelector('.chevron-icon');

        if (!detailsElement || !chevronIcon) return;

        const isCurrentlyHidden = detailsElement.classList.toggle('hidden');
        chevronIcon.classList.toggle('rotate-180', !isCurrentlyHidden);

        cardElement.classList.toggle('shadow-md', !isCurrentlyHidden);
        cardElement.classList.toggle('border-slate-200', !isCurrentlyHidden);
        cardElement.classList.toggle('shadow-soft', isCurrentlyHidden);
        cardElement.classList.toggle('border-slate-100', isCurrentlyHidden);
    }

    function toggleTradeCard(headerElement) {
        if (!headerElement) return;

        const detailsElement = headerElement.nextElementSibling;
        if (!detailsElement || !detailsElement.classList) return;

        const isCurrentlyHidden = detailsElement.classList.toggle('hidden');
        headerElement.classList.toggle('opacity-90', !isCurrentlyHidden);

        const chevronIcon = headerElement.querySelector('[data-lucide="chevron-down"]');
        if (chevronIcon) {
            chevronIcon.classList.toggle('rotate-180', !isCurrentlyHidden);
        }
    }
</script>
