<!-- Mobile Bottom Navigation — Liquid Glass Nav -->
<nav aria-label="Mobile Navigation" class="md:hidden fixed z-50 left-5 right-5" style="bottom: calc(1.25rem + env(safe-area-inset-bottom));">
    <div id="liquid-glass-navbar"
         class="relative h-[68px] flex items-center justify-around px-2 rounded-[32px]
                bg-white/60 backdrop-blur-xl backdrop-saturate-150
                shadow-[0_20px_40px_-14px_rgba(15,23,42,0.28),inset_0_1.5px_2px_rgba(255,255,255,0.9),inset_0_-1.5px_2px_rgba(15,23,42,0.05)]">

        <!-- Sliding capsule -->
        <div id="sliding-capsule"
             class="absolute top-[6px] bottom-[6px] rounded-[24px]
                    bg-white/80 shadow-[0_3px_10px_rgba(15,23,42,0.10),inset_0_1px_1px_rgba(255,255,255,0.9)]
                    pointer-events-none opacity-0">
        </div>

        <a href="{{ '/screener/' ~ strategy_slug if strategy_slug else '/screener' }}"
           data-tab
           {% if active_page == 'screener' %}aria-current="page" data-active{% endif %}
           class="tab-item relative z-10 flex flex-col items-center justify-center w-full h-full transition-colors {{ 'font-semibold text-[#007AFF]' if active_page == 'screener' else 'text-slate-500' }}">
            <svg aria-hidden="true" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="m9 11 2 2 4-4"></path></svg>
            <span class="text-xs font-medium mt-1">Screener</span>
        </a>
        <a href="{{ '/trades/' ~ strategy_slug if strategy_slug else '/trades' }}"
           data-tab
           {% if active_page == 'trades' %}aria-current="page" data-active{% endif %}
           class="tab-item relative z-10 flex flex-col items-center justify-center w-full h-full transition-colors {{ 'font-semibold text-[#007AFF]' if active_page == 'trades' else 'text-slate-500' }}">
            <svg aria-hidden="true" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
            <span class="text-xs font-medium mt-1">Trades</span>
        </a>
        <a href="/analytics"
           data-tab
           {% if active_page == 'analytics' %}aria-current="page" data-active{% endif %}
           class="tab-item relative z-10 flex flex-col items-center justify-center w-full h-full transition-colors {{ 'font-semibold text-[#007AFF]' if active_page == 'analytics' else 'text-slate-500' }}">
            <svg aria-hidden="true" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"></path><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path></svg>
            <span class="text-xs font-medium mt-1">Analytics</span>
        </a>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const capsule = document.getElementById('sliding-capsule');

        function repositionCapsule(targetElement) {
            if (!capsule || !targetElement) return;
            capsule.style.left = targetElement.offsetLeft + 'px';
            capsule.style.width = targetElement.offsetWidth + 'px';
        }

        const activeTab = document.querySelector('#liquid-glass-navbar .tab-item[data-active]');
        if (activeTab && capsule) {
            repositionCapsule(activeTab);
            capsule.classList.remove('opacity-0');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    capsule.style.transition = 'left 380ms cubic-bezier(0.25,1.1,0.4,1), width 380ms cubic-bezier(0.25,1.1,0.4,1)';
                });
            });
        }

        window.addEventListener('resize', () => {
            const currentActiveTab = document.querySelector('#liquid-glass-navbar .tab-item[data-active]');
            repositionCapsule(currentActiveTab);
        });
    });
</script>
