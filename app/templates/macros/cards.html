{% macro render_kpi_card(title, value, icon_name, value_classes="text-slate-900") %}
<article class="bg-white rounded-2xl shadow-sm p-6 flex items-center gap-4 border border-slate-100">
    <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-indigo-500">
        <i data-lucide="{{ icon_name }}" class="w-6 h-6"></i>
    </div>
    <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{{ title }}</p>
        <p class="text-2xl font-black {{ value_classes }}">{{ value }}</p>
    </div>
</article>
{% endmacro %}
