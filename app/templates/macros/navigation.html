{% macro render_mobile_header(title, strategy_slug) %}
<nav class="glass-nav sticky top-0 w-full z-50 px-4 flex items-center h-14 bg-slate-100/90">
    <div class="flex items-center justify-between w-full">
        <span class="text-lg font-bold text-slate-900 tracking-tight">{{ title }}</span>
        <div class="flex items-center bg-slate-200/60 p-1 rounded-lg">
            <a href="/trades/{{ strategy_slug }}"
                class="bg-white shadow-sm text-slate-900 px-3 py-1 rounded-md text-xs font-bold transition-all">Trades</a>
            <a href="/screener/{{ strategy_slug }}"
                class="text-slate-500 active:text-slate-700 px-3 py-1 rounded-md text-xs font-bold transition-colors">Screener</a>
        </div>
    </div>
</nav>
{% endmacro %}

{% macro render_desktop_header(title, strategy_slug) %}
<nav class="glass-nav fixed top-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center">
            <!-- Brand -->
            <div class="flex-shrink-0 flex items-center">
                <span class="text-xl font-medium text-slate-900 tracking-tight">{{ title }}</span>
            </div>
            <!-- Links -->
            <div class="hidden md:flex items-center space-x-1 ml-10">
                <a href="/trades/{{ strategy_slug }}"
                    class="bg-blue-50 text-blue-600 px-3 py-2 rounded-lg text-sm font-medium transition-colors">
                    Trades
                </a>
                <a href="/screener/{{ strategy_slug }}"
                    class="text-slate-500 hover:text-slate-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    Screener
                </a>
            </div>
            <!-- Dashboard Link -->
            <div class="ml-auto">
                <a href="/trades"
                    class="text-slate-500 hover:text-slate-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    Dashboard
                </a>
            </div>
        </div>
    </div>
</nav>
{% endmacro %}
