# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        name: Ruff Linter (Auto-Fix)
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [".", "--exclude", ".venv,tests"]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-x", "tests,.venv"]
        exclude: ^(tests/|\.venv/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: architecture-sync-check
        name: Architecture Sync Check
        entry: python3 .agents/skills/architecture-sync/scripts/check_sync.py
        language: system
        pass_filenames: false

