# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        name: Ruff Linter (Auto-Fix)
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [".", "--exclude", ".venv,test,tests"]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-x", "test,tests,.venv"]
        exclude: ^(test/|tests/|\.venv/)

  - repo: local
    hooks:
      - id: mypy
        name: MyPy Type Checker
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: architecture-sync-check
        name: Architecture Sync Check
        entry: python3 .agents/skills/architecture-sync/scripts/check_sync.py
        language: system
        pass_filenames: false

