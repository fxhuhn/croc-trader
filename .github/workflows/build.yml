name: Docker Build and Push

on:
  push:
    branches: [ "next" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: |
            ${{ github.event.repository.name }}:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show Trivy findings (diagnostic table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.73.0'
          image-ref: '${{ github.event.repository.name }}:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.73.0'
          image-ref: '${{ github.event.repository.name }}:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Ensure Trivy SARIF validity
        if: always()
        run: |
          if [ ! -s trivy-results.sarif ]; then
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Container Smoke Test (Pre-Push Gate)
        run: |
          set -euo pipefail

          cleanup() {
            echo "--- Container logs at exit ---"
            docker logs croc-smoke 2>/dev/null || true
            docker stop croc-smoke 2>/dev/null || true
            docker rm croc-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Starting Docker test container..."
          docker run -d --name croc-smoke \
            -e TZ=Europe/Berlin \
            -v "${{ github.workspace }}/data/holidays.yaml:/app/data/holidays.yaml:ro" \
            "${{ github.event.repository.name }}:test" \
            gunicorn -c gunicorn.conf.py --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:8000 run:app

          echo "Waiting for container startup and cache pre-warming..."
          READY=0
          for i in $(seq 1 20); do
            if docker exec croc-smoke curl -s -f http://127.0.0.1:8000/health > /dev/null 2>&1; then
              READY=1
              echo "Container responded successfully to /health on attempt ${i}."
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Container failed to start or respond within 40 seconds!"
            exit 1
          fi

          echo "Running smoke tests on all 18 pre-warm UI dashboard and screener routes..."
          ROUTES="/analytics /analytics/monthly-matrix /trades /trades/dip-buyer /trades/turnover /trades/ndx-momentum /trades/twopercent /trades/tgim /trades/bridge-scout /trades/bounce-bandit /screener /screener/dip-buyer /screener/turnover /screener/twopercent /screener/ndx-momentum /screener/tgim /screener/bridge-scout /screener/bounce-bandit"
          FAILED_ROUTES=()

          for route in $ROUTES; do
            HTTP_STATUS=$(docker exec croc-smoke curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${route}")
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "::error::Smoke test failed for ${route}: HTTP ${HTTP_STATUS}"
              FAILED_ROUTES+=("${route} (HTTP ${HTTP_STATUS})")
            else
              echo "  ✓ Smoke test passed: ${route} (HTTP 200)"
            fi
          done

          if [ ${#FAILED_ROUTES[@]} -ne 0 ]; then
            echo "::error::Smoke test failed on routes: ${FAILED_ROUTES[*]}! Aborting Docker push."
            exit 1
          fi
          echo "✅ All container smoke tests passed successfully. Proceeding to Docker push."

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha