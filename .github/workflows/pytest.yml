# .github/workflows/pytest.yml
name: pytest

on:
  push:
    branches: [ next ]
  pull_request:
    branches: [ next ]
  workflow_dispatch:

jobs:
  architecture-check:
    name: Architecture Synchronization Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Run Architecture Sync Validation
      run: |
        python .agents/skills/architecture-sync/scripts/check_sync.py

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: architecture-check

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.15-dev', '3.14', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt pytest pytest-cov; fi

    - name: Run pytest
      if: matrix.python-version != '3.13'
      continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
      run: |
        # Add current directory to PYTHONPATH so 'app' can be imported
        export PYTHONPATH=$PYTHONPATH:.
        pytest test/ -v --tb=short

    - name: Run pytest with coverage
      if: matrix.python-version == '3.13'
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest test/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=88

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
